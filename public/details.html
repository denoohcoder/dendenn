<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Loan Details - Maya</title>
  <style>
    :root{--mint:#00c896;--dark:#009f7a;--pale:#e2faf4;--blue:#176ff5;--ink:#123b36;--muted:#75908c;--line:#d9eeea;--white:#fff;--danger:#d94b4b;--shadow:0 20px 50px #1255491f}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;color:var(--ink);background:linear-gradient(135deg,#e9faf5,#f8fffd)}button,input,select,textarea{font:inherit}button{cursor:pointer}.nav-brand{display:block;width:120px;height:auto}.help-button{position:fixed;z-index:10;top:18px;right:20px;border:0;border-radius:999px;background:#111;color:#fff;padding:10px 18px;font-size:13px;font-weight:800;box-shadow:0 8px 18px #0003}.page-footer{margin-top:auto;padding:18px 20px 20px;text-align:center;color:var(--muted);font-size:12px}.auth-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:70px 20px 0;min-height:100vh}.auth-card{width:min(100%,480px);padding:34px 30px 25px;border:1px solid var(--line);border-radius:27px;background:#fff;box-shadow:var(--shadow)}.auth-logo{width:130px;margin:0 auto 27px}.auth-card h1{margin:0;text-align:center;font-size:28px}.subtitle{margin:10px 0 23px;text-align:center;line-height:1.5;color:var(--muted)}.demo-note{margin-bottom:17px;padding:10px;border-radius:11px;background:#176ff512;color:var(--blue);text-align:center;font-size:12px;font-weight:700}.group{margin-bottom:16px}.group label{display:block;margin-bottom:8px;font-size:13px;font-weight:800}.field{display:flex;align-items:center;overflow:hidden;border:1px solid var(--line);border-radius:12px;background:#fbfffe}.field:focus-within{border-color:var(--mint);box-shadow:0 0 0 4px #00c8961a}.field input,.field textarea,.field select{width:100%;padding:14px;border:0;outline:0;background:transparent;color:var(--ink)}.field textarea{min-height:90px;resize:vertical}.prefix{padding-left:14px;color:var(--muted);font-weight:800}.primary-button{width:100%;padding:15px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--mint),var(--dark));color:#fff;font-weight:800}.back-link{display:inline-block;margin-bottom:20px;color:var(--dark);text-decoration:none;font-size:13px;font-weight:800}
  </style>
</head>
<body>
  <button class="help-button" type="button" onclick="alert('Help is available in this prototype.')">Help</button>

  <section class="auth-screen">
    <div class="auth-card">
      <a href="application.html" class="back-link">← Back</a>
      <img class="nav-brand nav-image auth-logo" src="https://www.maya.ph/hubfs/Maya/MAYA-Mint%20Green.svg" loading="lazy" alt="Maya Logo">
      <h1>Loan details</h1>
      <p class="subtitle">Complete your application to continue.</p>
      <div class="demo-note">Demo only — no real data is stored.</div>
      <form id="detailsForm">
        <div class="group">
          <label for="fullName">Full name</label>
          <div class="field">
            <input id="fullName" type="text" placeholder="Juan Dela Cruz" required>
          </div>
        </div>
        <div class="group">
          <label for="phoneNumber">Phone number</label>
          <div class="field">
            <span class="prefix">+63</span>
            <input id="phoneNumber" type="tel" maxlength="10" placeholder="9XX XXX XXXX" required>
          </div>
        </div>
        <div class="group">
          <label for="loanPurpose">Loan purpose</label>
          <div class="field">
            <select id="loanPurpose" required>
              <option value="">Choose a purpose</option>
              <option>Emergency expenses</option>
              <option>Home improvement</option>
              <option>Education</option>
              <option>Medical expenses</option>
              <option>Business capital</option>
              <option>Debt consolidation</option>
              <option>Other</option>
            </select>
          </div>
        </div>
        <div class="group">
          <label for="monthlyIncome">Monthly income</label>
          <div class="field">
            <input id="monthlyIncome" type="number" min="0" placeholder="25000" required>
          </div>
        </div>
        <button class="primary-button" type="submit">Continue to login</button>
      </form>
    </div>
    <footer class="page-footer">© 2026 Maya</footer>
  </section>

  <script>
    document.getElementById('detailsForm').onsubmit=e=>{
      e.preventDefault();
      window.location.href='login.html';
    };
    document.querySelectorAll('input[type=tel]').forEach(x=>x.addEventListener('input',()=>x.value=x.value.replace(/\D/g,'').slice(0,10)));
  </script>
</body>
</html>
