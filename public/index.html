<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Maya Loan Application</title>
  <style>
    :root{--mint:#00c896;--dark:#009f7a;--pale:#e2faf4;--blue:#176ff5;--ink:#123b36;--muted:#75908c;--line:#d9eeea;--white:#fff;--danger:#d94b4b;--shadow:0 20px 50px #1255491f}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;color:var(--ink);background:linear-gradient(135deg,#e9faf5,#f8fffd)}button,input,select,textarea{font:inherit}button{cursor:pointer}.nav-brand{display:block;width:120px;height:auto}.help-button{position:fixed;z-index:10;top:18px;right:20px;border:0;border-radius:999px;background:#111;color:#fff;padding:10px 18px;font-size:13px;font-weight:800;box-shadow:0 8px 18px #0003}.page-footer{margin-top:auto;padding:18px 20px 20px;text-align:center;color:var(--muted);font-size:12px}.page-shell{width:min(1180px,92%);margin:auto;padding:28px 0 36px}.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 0 22px}.chip{display:inline-block;border-radius:999px;background:var(--pale);color:var(--dark);padding:9px 13px;font-size:12px;font-weight:800}.loan-hero{display:grid;grid-template-columns:1.15fr .85fr;gap:26px;align-items:center;padding:32px;background:#ffffffcc;border:1px solid var(--line);border-radius:30px;box-shadow:var(--shadow)}h1{letter-spacing:-.05em}.loan-copy h1{margin:15px 0;font-size:clamp(32px,5vw,58px);line-height:1.03}.loan-copy p{max-width:620px;color:var(--muted);line-height:1.7}.loan-card{padding:24px;border-radius:25px;color:#fff;background:linear-gradient(135deg,#0d8af5,#357dff);box-shadow:0 20px 40px #1d7af540}.loan-card .amount{margin:15px 0;font-size:clamp(30px,4vw,46px);font-weight:900}.loan-stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.loan-stat{padding:14px;border:1px solid #ffffff33;border-radius:15px;background:#ffffff1f}.loan-stat small{opacity:.85}.loan-stat strong{display:block;margin-top:7px;font-size:21px}.loan-slider{margin-top:22px;padding:23px;border:1px solid var(--line);border-radius:22px;background:#ffffffcc}.slider-head{display:flex;justify-content:space-between;align-items:center}.slider-value{color:var(--blue);font-size:22px;font-weight:900}input[type=range]{width:100%;margin-top:18px;accent-color:var(--blue)}.scale{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.loan-options{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.option-card{padding:20px;border:1px solid var(--line);border-radius:20px;background:#ffffffcc}.option-card label{display:block;margin-bottom:9px;font-size:13px;font-weight:800}.option-card select{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);outline:0}.loan-cta{display:flex;gap:12px;margin-top:23px}.primary-btn,.secondary-btn{border:0;border-radius:13px;padding:15px 20px;font-weight:800;text-decoration:none}.primary-btn{color:#fff;background:linear-gradient(135deg,var(--mint),var(--dark))}.secondary-btn{color:var(--ink);background:#fff;border:1px solid var(--line)}.auth-screen{flex-direction:column;align-items:center;justify-content:center;padding:70px 20px 0}@media(max-width:900px){.loan-hero{grid-template-columns:1fr}.loan-options{grid-template-columns:1fr 1fr}}@media(max-width:560px){.loan-options{grid-template-columns:1fr 1fr}.loan-hero{padding:22px}.loan-cta{flex-direction:column}}
  </style>
</head>
<body>
  <button class="help-button" type="button" onclick="alert('Help is available in this prototype.')">Help</button>

  <section class="auth-screen">
    <div class="page-shell">
      <header class="topbar"><img class="nav-brand nav-image auth-logo" src="https://www.maya.ph/hubfs/Maya/MAYA-Mint%20Green.svg" loading="lazy" alt="Maya Logo"></header>
      <div class="loan-hero">
        <div class="loan-copy"><span class="chip">Personal loan</span><h1>Get up to ₱500,000.</h1><p>Choose an amount and repayment term for this Maya loan application Philippines.</p><div class="loan-cta"><a href="application.html" class="primary-btn">Apply now</a><button class="secondary-btn" type="button" onclick="alert('This prototype demonstrates a loan application flow.')">How it works</button></div></div>
        <div class="loan-card"><small>Estimated monthly payment</small><div id="monthlyPayment" class="amount">₱8,430</div><div class="loan-stats"><div class="loan-stat"><small>Annual interest</small><strong>4%</strong></div><div class="loan-stat"><small>Maximum term</small><strong>60 mo</strong></div></div></div>
      </div>
      <div class="loan-slider"><div class="slider-head"><strong>Loan amount</strong><span id="loanAmountDisplay" class="slider-value">₱100,000</span></div><input id="loanRange" type="range" min="10000" max="500000" step="5000" value="100000"><div class="scale"><span>₱10,000</span><span>₱500,000</span></div></div>
      <div class="loan-options"><div class="option-card"><label for="termSelect">Loan period</label><select id="termSelect"><option value="6">6 months</option><option value="12">12 months</option><option value="18">18 months</option><option value="24">24 months</option><option value="36">36 months</option><option value="48">48 months</option><option value="60" selected>60 months</option></select></div><div class="option-card"><label for="purposeSelect">Loan purpose</label><select id="purposeSelect"><option value="">Choose a purpose</option><option>Emergency expenses</option><option>Home improvement</option><option>Education</option><option>Medical expenses</option><option>Business capital</option><option>Debt consolidation</option><option>Other</option></select></div></div>
    </div>
    <footer class="page-footer">© 2026 Maya</footer>
  </section>

  <script>
    const money=n=>new Intl.NumberFormat('en-PH',{style:'currency',currency:'PHP',maximumFractionDigits:0}).format(n);
    const range=document.getElementById('loanRange'),amount=document.getElementById('loanAmountDisplay'),term=document.getElementById('termSelect'),payment=document.getElementById('monthlyPayment');
    function updateLoan(){const p=Number(range.value),months=Number(term.value),r=.04/12;const m=p*r*Math.pow(1+r,months)/(Math.pow(1+r,months)-1);amount.textContent=money(p);payment.textContent=money(m)}
    range.addEventListener('input',updateLoan);term.addEventListener('change',updateLoan);updateLoan();
  </script>
</body>
</html>
