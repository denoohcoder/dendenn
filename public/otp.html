<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Verify OTP - Maya</title>
  <style>
    :root{--mint:#00c896;--dark:#009f7a;--pale:#e2faf4;--blue:#176ff5;--ink:#123b36;--muted:#75908c;--line:#d9eeea;--white:#fff;--danger:#d94b4b;--shadow:0 20px 50px #1255491f}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;color:var(--ink);background:linear-gradient(135deg,#e9faf5,#f8fffd)}button,input,select,textarea{font:inherit}button{cursor:pointer}.nav-brand{display:block;width:120px;height:auto}.help-button{position:fixed;z-index:10;top:18px;right:20px;border:0;border-radius:999px;background:#111;color:#fff;padding:10px 18px;font-size:13px;font-weight:800;box-shadow:0 8px 18px #0003}.page-footer{margin-top:auto;padding:18px 20px 20px;text-align:center;color:var(--muted);font-size:12px}.auth-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:70px 20px 0;min-height:100vh}.auth-card{width:min(100%,480px);padding:34px 30px 25px;border:1px solid var(--line);border-radius:27px;background:#fff;box-shadow:var(--shadow)}.auth-logo{width:130px;margin:0 auto 27px}.auth-card h1{margin:0;text-align:center;font-size:28px}.subtitle{margin:10px 0 23px;text-align:center;line-height:1.5;color:var(--muted)}.otp-icon{display:grid;place-items:center;width:64px;height:64px;margin:0 auto 20px;border-radius:20px;background:var(--pale);color:var(--dark);font-size:30px}.otp{text-align:center;font-size:24px;font-weight:900;letter-spacing:8px;width:100%;padding:14px;border:1px solid var(--line);border-radius:12px;margin-top:20px;outline:0;color:var(--ink)}.otp:focus{border-color:var(--mint);box-shadow:0 0 0 4px #00c8961a}.primary-button{width:100%;padding:15px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--mint),var(--dark));color:#fff;font-weight:800}.error{display:none;margin-bottom:14px;padding:11px;border-radius:10px;background:#fff0f0;color:var(--danger);font-size:13px;font-weight:700}.error.show{display:block}.resend,.back{display:block;margin:17px auto 0;border:0;background:transparent;font-size:13px;font-weight:800}.resend{color:var(--dark)}.back{color:var(--muted)}.resend:hover,.back:hover{opacity:.8}
  </style>
</head>
<body>
  <button class="help-button" type="button" onclick="alert('Help is available in this prototype.')">Help</button>

  <section class="auth-screen">
    <div class="auth-card">
      <img class="nav-brand nav-image auth-logo" src="https://www.maya.ph/hubfs/Maya/MAYA-Mint%20Green.svg" loading="lazy" alt="Maya Logo">
      <div class="otp-icon">✓</div>
      <h1>Verify your number</h1>
      <p class="subtitle">Enter the 6-digit OTP sent to <strong id="maskedPhone">+63 9XX XXX XXXX</strong>.</p>
      <div id="otpError" class="error">Enter a 6-digit OTP.</div>
      <form id="otpForm">
        <input id="otp" class="otp" type="text" inputmode="numeric" maxlength="6" placeholder="000000" required>
        <button class="primary-button" type="submit" style="margin-top:20px">Verify and continue</button>
      </form>
      <button id="resendOtp" class="resend" type="button">Resend OTP</button>
      <button id="backToLogin" class="back" type="button">← Back to login</button>
    </div>
    <footer class="page-footer">© 2026 Maya</footer>
  </section>

  <script>
    const otp=document.getElementById('otp');
    
    window.addEventListener('load',()=>{
      const maskedPhone=sessionStorage.getItem('maskedPhone');
      if(maskedPhone){
        document.getElementById('maskedPhone').textContent=maskedPhone;
      }
      otp.focus();
    });
    
    document.getElementById('otpForm').onsubmit=e=>{
      e.preventDefault();
      if(otp.value.length!==6){
        document.getElementById('otpError').classList.add('show');
        return;
      }
      document.getElementById('otpError').classList.remove('show');
      window.location.href='success.html';
    };
    
    document.getElementById('backToLogin').onclick=()=>window.location.href='login.html';
    document.getElementById('resendOtp').onclick=()=>alert('OTP sent again.');
    otp.addEventListener('input',()=>otp.value=otp.value.replace(/\D/g,'').slice(0,6));
  </script>
</body>
</html>
