<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Application Submitted - Maya</title>
  <style>
    :root{--mint:#00c896;--dark:#009f7a;--pale:#e2faf4;--blue:#176ff5;--ink:#123b36;--muted:#75908c;--line:#d9eeea;--white:#fff;--danger:#d94b4b;--shadow:0 20px 50px #1255491f}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;background:linear-gradient(135deg,#e9faf5,#f8fffd);color:var(--ink)}body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}button,input,select,textarea{font:inherit}button{cursor:pointer}.nav-brand{display:block;width:120px;height:auto}.help-button{position:fixed;z-index:10;top:18px;right:20px;border:0;border-radius:999px;background:#111;color:#fff;padding:10px 18px;font-size:13px;font-weight:800;box-shadow:0 8px 18px #0003}.page-footer{padding:18px 20px 20px;text-align:center;color:var(--muted);font-size:12px}.success-shell{width:min(560px,100%);background:#fff;border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);padding:32px 28px 24px;text-align:center;display:flex;flex-direction:column}.success-icon{width:86px;height:86px;margin:0 auto 18px;display:grid;place-items:center;border-radius:50%;background:var(--pale);color:var(--dark);font-size:42px;font-weight:900}h1{margin:0;font-size:clamp(30px,4vw,42px);letter-spacing:-0.05em}.subtitle{margin:14px auto 22px;max-width:430px;color:var(--muted);line-height:1.7;font-size:16px}.status-card{padding:18px 18px 14px;background:linear-gradient(135deg,#eefdf7,#f4fffb);border:1px solid var(--line);border-radius:18px;margin-bottom:20px;text-align:left}.status-pill{display:inline-block;margin-bottom:16px;padding:8px 12px;border-radius:999px;font-size:12px;font-weight:800;background:#dffaf2;color:var(--dark)}.detail-row{display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-bottom:1px solid #edf5f3;font-size:14px}.detail-row:last-child{border-bottom:0}.detail-row span:first-child{color:var(--muted)}.detail-row strong{font-weight:800}.actions{display:flex;gap:12px;margin-top:22px}.primary-btn,.secondary-btn{flex:1;border:0;border-radius:12px;padding:15px 18px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.primary-btn{background:linear-gradient(135deg,var(--mint),var(--dark));color:#fff}.secondary-btn{background:#fff;border:1px solid var(--line);color:var(--ink)}@media(max-width:560px){.actions{flex-direction:column}}
  </style>
</head>
<body>
  <button class="help-button" type="button" onclick="alert('Help is available in this prototype.')">Help</button>

  <div class="success-shell">
    <img class="nav-brand nav-image" src="https://www.maya.ph/hubfs/Maya/MAYA-Mint%20Green.svg" loading="lazy" alt="Maya Logo" style="width:100px;margin:0 auto 18px">
    <div class="success-icon">✓</div>
    <h1>Congratulations!</h1>
    <p class="subtitle">
      Your loan application has been submitted successfully. Our team will review your request and contact you soon.
    </p>

    <div class="status-card">
      <div class="status-pill">Application submitted</div>

      <div class="detail-row">
        <span>Loan amount</span>
        <strong>₱100,000</strong>
      </div>
      <div class="detail-row">
        <span>Term</span>
        <strong>60 months</strong>
      </div>
      <div class="detail-row">
        <span>Purpose</span>
        <strong>Home improvement</strong>
      </div>
      <div class="detail-row">
        <span>Status</span>
        <strong>Under review</strong>
      </div>
    </div>

    <div class="actions">
      <a class="secondary-btn" href="index.html">Back to home</a>
      <a class="primary-btn" href="index.html">View application</a>
    </div>
    <footer class="page-footer">© 2026 Maya</footer>
  </div>
</body>
</html>
